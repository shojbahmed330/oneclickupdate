name: Build APK

# Inputs:
#   build_id, app_name, package_id, version_name, version_code,
#   signing_mode (debug|release),
#   build_target  (apk-debug | apk-release | aab-release)  ← NEW
#   callback_url (build-webhook), files_url, keystore_url, webhook_secret

on:
  workflow_dispatch:
    inputs:
      build_id:        { required: true }
      app_name:        { required: false }
      package_id:      { required: false }
      version_name:    { required: false }
      version_code:    { required: false }
      signing_mode:    { required: false, default: "debug" }
      build_target:    { required: false, default: "" }
      callback_url:    { required: true }
      files_url:       { required: true }
      keystore_url:    { required: false }
      webhook_secret:  { required: true }

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Setup Java
        uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "17" }

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare progress reporter
        run: |
          cat >/tmp/build_notify.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          EVENT="$1"; STEP="${2:-}"; DETAIL="${3:-}"
          PAYLOAD=$(node -e 'const [build_id,event,step_key,detail]=process.argv.slice(1); const body={build_id,event}; if(step_key) body.step_key=step_key; if(detail) body.detail=detail; if(event==="step_start"){body.github_run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"; body.github_run_id="${{ github.run_id }}"} console.log(JSON.stringify(body));' "${{ inputs.build_id }}" "$EVENT" "$STEP" "$DETAIL")
          curl -sS -X POST "${{ inputs.callback_url }}" -H "x-build-secret: ${{ inputs.webhook_secret }}" -H "Content-Type: application/json" -d "$PAYLOAD"
          SH
          chmod +x /tmp/build_notify.sh
          /tmp/build_notify.sh step_done queued "GitHub workflow started"

      - name: Fetch project files
        run: |
          /tmp/build_notify.sh step_start checkout "Fetching project files"
          mkdir -p workspace && cd workspace
          curl -fsS "${{ inputs.files_url }}" \
            -H "x-build-secret: ${{ inputs.webhook_secret }}" -o files.json
          node -e "const fs=require('fs'),p=require('path');const j=JSON.parse(fs.readFileSync('files.json','utf8'));for(const f of j.files){fs.mkdirSync(p.dirname(f.path),{recursive:true});fs.writeFileSync(f.path,f.content)}"
          /tmp/build_notify.sh step_done checkout "Project files loaded"

      - name: Install deps
        working-directory: workspace
        run: |
          /tmp/build_notify.sh step_start install "Installing npm dependencies"
          npm install --no-audit --no-fund
          /tmp/build_notify.sh step_done install "Dependencies installed"

      - name: Vite build
        working-directory: workspace
        run: |
          /tmp/build_notify.sh step_start web_build "Building Vite bundle"
          npm run build
          /tmp/build_notify.sh step_done web_build "Web bundle built"

      - name: Capacitor sync
        working-directory: workspace
        run: |
          set -e
          /tmp/build_notify.sh step_start cap_sync "Syncing Android project"
          # Capacitor needs TypeScript to parse capacitor.config.ts
          if [ ! -d node_modules/typescript ]; then
            node -e "const fs=require('fs');const p='package.json';const pkg=JSON.parse(fs.readFileSync(p,'utf8'));pkg.devDependencies={...(pkg.devDependencies||{}),typescript:pkg.devDependencies?.typescript||'^5.8.3'};fs.writeFileSync(p,JSON.stringify(pkg,null,2)+'\n');"
            npm install --no-audit --no-fund --include=dev
          fi
          if [ ! -f android/gradlew ]; then
            rm -rf android
            npx cap add android
          fi
          npx cap sync android
          test -f android/gradlew
          # Pin Android SDK levels to meet Play Store 2024+ requirements
          # (target API 34, min API 23). Capacitor sets these in
          # android/variables.gradle — we overwrite to be explicit.
          VARS=android/variables.gradle
          if [ -f "$VARS" ]; then
            sed -i -E "s|minSdkVersion\s*=\s*[0-9]+|minSdkVersion = 23|g" "$VARS"
            sed -i -E "s|compileSdkVersion\s*=\s*[0-9]+|compileSdkVersion = 34|g" "$VARS"
            sed -i -E "s|targetSdkVersion\s*=\s*[0-9]+|targetSdkVersion = 34|g" "$VARS"
          fi
          /tmp/build_notify.sh step_done cap_sync "Android project synced (targetSdk=34)"

      # ── Custom branding (logo + name + package id + version) ────────
      # files.json carries logo_url / splash_url / colors. We rewrite
      # applicationId, versionCode, versionName in app/build.gradle and
      # regenerate every mipmap density from the user-supplied 512×512 PNG.
      - name: Apply custom branding
        working-directory: workspace
        run: |
          set -e
          /tmp/build_notify.sh step_start inject "Applying app branding"
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick >/dev/null
          node -e "
            const fs=require('fs');const j=JSON.parse(fs.readFileSync('files.json','utf8'));
            const out={
              app_name:j.app_name||'My App',
              package_id:j.package_id||'app.lovable.unknown',
              version_name:j.version_name||'1.0.0',
              version_code:String(j.version_code||1),
              logo_url:j.logo_url||'',
              splash_url:j.splash_url||'',
              adaptive_bg:j.adaptive_bg_color||'#FFFFFF',
              splash_bg:j.splash_bg_color||'#FFFFFF',
            };
            const esc=(s)=>\"'\"+String(s).replace(/'/g,\"'\\\\''\")+\"'\";
            fs.writeFileSync('branding.env',Object.entries(out).map(([k,v])=>k+'='+esc(v)).join('\n'));
          "
          set -a; . ./branding.env; set +a
          GRADLE=android/app/build.gradle
          if [ -f "$GRADLE" ]; then
            # applicationId
            sed -i -E "s|applicationId\s+\"[^\"]+\"|applicationId \"${package_id}\"|g" "$GRADLE"
            sed -i -E "s|applicationId\s+'[^']+'|applicationId \"${package_id}\"|g" "$GRADLE"
            # versionCode
            sed -i -E "s|versionCode\s+[0-9]+|versionCode ${version_code}|g" "$GRADLE"
            # versionName
            sed -i -E "s|versionName\s+\"[^\"]+\"|versionName \"${version_name}\"|g" "$GRADLE"
          fi

          # AndroidManifest package attribute (legacy) — best effort
          MAN=android/app/src/main/AndroidManifest.xml
          if [ -f "$MAN" ]; then
            sed -i -E "s|package=\"[^\"]+\"|package=\"${package_id}\"|" "$MAN" || true
          fi

          # strings.xml app_name
          STR=android/app/src/main/res/values/strings.xml
          if [ -f "$STR" ]; then
            sed -i -E "s|(<string name=\"app_name\">)[^<]*(</string>)|\1${app_name}\2|" "$STR" || true
            sed -i -E "s|(<string name=\"title_activity_main\">)[^<]*(</string>)|\1${app_name}\2|" "$STR" || true
          fi

          # Logo → mipmap-* icons
          if [ -n "${logo_url}" ]; then
            curl -fsSL "${logo_url}" -o /tmp/logo.png
            RES=android/app/src/main/res
            declare -A SIZES=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
            for d in "${!SIZES[@]}"; do
              S=${SIZES[$d]}
              mkdir -p "$RES/mipmap-$d"
              convert /tmp/logo.png -resize ${S}x${S} "$RES/mipmap-$d/ic_launcher.png"
              # Round icon — same square (Android masks it at runtime)
              cp "$RES/mipmap-$d/ic_launcher.png" "$RES/mipmap-$d/ic_launcher_round.png"
              # Adaptive foreground (108dp -> use 432 base, scale per density)
              FG=$((S * 9 / 4))
              convert /tmp/logo.png -resize ${FG}x${FG} -background none -gravity center -extent ${FG}x${FG} "$RES/mipmap-$d/ic_launcher_foreground.png"
            done

            # Adaptive icon XML + background color
            mkdir -p "$RES/mipmap-anydpi-v26" "$RES/values"
            cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background"/>
            <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
            cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

            # ic_launcher_background color
            COLORS="$RES/values/ic_launcher_background.xml"
            cat > "$COLORS" <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="ic_launcher_background">${adaptive_bg}</color>
          </resources>
          XML
          fi

          # Splash screen (Capacitor SplashScreen plugin reads drawable/splash.png)
          if [ -n "${splash_url}" ]; then
            curl -fsSL "${splash_url}" -o /tmp/splash.png
            RES=android/app/src/main/res
            for d in drawable drawable-port-hdpi drawable-port-xhdpi drawable-port-xxhdpi drawable-port-xxxhdpi drawable-land-hdpi drawable-land-xhdpi drawable-land-xxhdpi drawable-land-xxxhdpi; do
              mkdir -p "$RES/$d"
              convert /tmp/splash.png "$RES/$d/splash.png"
            done
          fi
          /tmp/build_notify.sh step_done inject "Branding applied"
        shell: bash


      # ── Release signing path ────────────────────────────────────────
      - name: Fetch / generate keystore
        if: ${{ inputs.signing_mode == 'release' }}
        id: keystore
        run: |
          set -e
          curl -fsS "${{ inputs.keystore_url }}&action=fetch" \
            -H "x-build-secret: ${{ inputs.webhook_secret }}" -o ks.json
          node -e "
            const fs=require('fs');const j=JSON.parse(fs.readFileSync('ks.json','utf8'));
            if(!j.has_keystore){console.error('no keystore configured');process.exit(2)}
            fs.writeFileSync('ks.alias',j.alias);
            fs.writeFileSync('ks.spw',j.store_password);
            fs.writeFileSync('ks.kpw',j.key_password);
            fs.writeFileSync('ks.dname',j.dname);
            fs.writeFileSync('ks.validity',String(j.validity_days));
            fs.writeFileSync('ks.needs_gen',j.needs_generation?'1':'0');
            if(j.jks_base64){fs.writeFileSync('app.jks',Buffer.from(j.jks_base64,'base64'))}
          "
          ALIAS=$(cat ks.alias); SPW=$(cat ks.spw); KPW=$(cat ks.kpw); DNAME=$(cat ks.dname); VAL=$(cat ks.validity); NEEDS=$(cat ks.needs_gen)
          if [ "$NEEDS" = "1" ]; then
            keytool -genkeypair -v -keystore app.jks -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity "$VAL" \
              -storepass "$SPW" -keypass "$KPW" -dname "$DNAME"
            B64=$(base64 -w0 app.jks)
            SHA1=$(keytool -list -v -keystore app.jks -alias "$ALIAS" -storepass "$SPW" | grep "SHA1:" | head -1 | awk '{print $2}')
            SHA256=$(keytool -list -v -keystore app.jks -alias "$ALIAS" -storepass "$SPW" | grep "SHA256:" | head -1 | awk '{print $2}')
            curl -fsS -X POST "${{ inputs.keystore_url }}&action=upload" \
              -H "x-build-secret: ${{ inputs.webhook_secret }}" -H "Content-Type: application/json" \
              -d "{\"jks_base64\":\"$B64\",\"sha1\":\"$SHA1\",\"sha256\":\"$SHA256\"}"
            echo "sha1=$SHA1" >> $GITHUB_OUTPUT
          else
            SHA1=$(keytool -list -v -keystore app.jks -alias "$ALIAS" -storepass "$SPW" | grep "SHA1:" | head -1 | awk '{print $2}')
            echo "sha1=$SHA1" >> $GITHUB_OUTPUT
          fi
          mv app.jks workspace/android/app/release.jks
          echo "alias=$ALIAS" >> $GITHUB_OUTPUT
          echo "::add-mask::$SPW"
          echo "::add-mask::$KPW"
          echo "spw=$SPW" >> $GITHUB_OUTPUT
          echo "kpw=$KPW" >> $GITHUB_OUTPUT

      - name: Patch Gradle for signing
        if: ${{ inputs.signing_mode == 'release' }}
        working-directory: workspace/android
        run: |
          cat >> app/build.gradle <<EOF

          android {
            signingConfigs {
              release {
                storeFile file('release.jks')
                storePassword System.getenv('KS_STORE_PW')
                keyAlias System.getenv('KS_ALIAS')
                keyPassword System.getenv('KS_KEY_PW')
              }
            }
            buildTypes {
              release { signingConfig signingConfigs.release }
            }
          }
          EOF

      # ── Resolve effective build target (legacy fallback) ────────────
      # Old callers don't pass build_target; preserve current behaviour:
      #   signing_mode=release  → apk-release (signed APK + best-effort AAB)
      #   signing_mode=debug    → apk-debug
      # New callers pass one of: apk-debug | apk-release | aab-release
      - name: Resolve build target
        id: target
        run: |
          BT="${{ inputs.build_target }}"
          if [ -z "$BT" ]; then
            if [ "${{ inputs.signing_mode }}" = "release" ]; then BT="apk-release"; else BT="apk-debug"; fi
            LEGACY=1
          else
            LEGACY=0
          fi
          echo "build_target=$BT"  >> $GITHUB_OUTPUT
          echo "legacy=$LEGACY"    >> $GITHUB_OUTPUT
          case "$BT" in
            apk-debug)   echo "want_apk=1" >> $GITHUB_OUTPUT; echo "want_aab=0" >> $GITHUB_OUTPUT ;;
            apk-release) echo "want_apk=1" >> $GITHUB_OUTPUT; echo "want_aab=0" >> $GITHUB_OUTPUT ;;
            aab-release) echo "want_apk=0" >> $GITHUB_OUTPUT; echo "want_aab=1" >> $GITHUB_OUTPUT ;;
            *) echo "::error ::Unknown build_target $BT"; exit 1 ;;
          esac
          # Legacy release path also produced an AAB best-effort.
          if [ "$LEGACY" = "1" ] && [ "${{ inputs.signing_mode }}" = "release" ]; then
            echo "want_aab=1" >> $GITHUB_OUTPUT
          fi

      - name: Build with Gradle
        working-directory: workspace/android
        env:
          KS_STORE_PW: ${{ steps.keystore.outputs.spw }}
          KS_KEY_PW: ${{ steps.keystore.outputs.kpw }}
          KS_ALIAS: ${{ steps.keystore.outputs.alias }}
          WANT_APK: ${{ steps.target.outputs.want_apk }}
          WANT_AAB: ${{ steps.target.outputs.want_aab }}
          BT: ${{ steps.target.outputs.build_target }}
        run: |
          set -e
          /tmp/build_notify.sh step_start gradle "Compiling ($BT)"
          APK_PATH=""; AAB_PATH=""

          if [ "$WANT_APK" = "1" ]; then
            if [ "${{ inputs.signing_mode }}" = "release" ]; then
              ./gradlew assembleRelease
              APK_PATH=$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -1)
            else
              # Debug build = signed with Android's debug keystore → installable.
              ./gradlew assembleDebug
              APK_PATH=$(ls app/build/outputs/apk/debug/*.apk | head -1)
            fi
            echo "apk_path=$APK_PATH" >> $GITHUB_ENV
            echo "Built APK: $APK_PATH ($(stat -c%s "$APK_PATH") bytes)"
          fi

          if [ "$WANT_AAB" = "1" ]; then
            if ./gradlew bundleRelease; then
              AAB_PATH=$(ls app/build/outputs/bundle/release/*.aab | head -1)
              echo "aab_path=$AAB_PATH" >> $GITHUB_ENV
              echo "aab_ok=1" >> $GITHUB_ENV
              echo "Built AAB: $AAB_PATH ($(stat -c%s "$AAB_PATH") bytes)"
            else
              echo "aab_ok=0" >> $GITHUB_ENV
              if [ "$BT" = "aab-release" ]; then
                echo "::error ::bundleRelease failed and AAB was the requested artifact."
                exit 1
              else
                echo "::warning ::bundleRelease failed — AAB unavailable, signed APK still produced."
              fi
            fi
          fi
          /tmp/build_notify.sh step_done gradle "Build complete"

      - name: Notify — uploading
        run: /tmp/build_notify.sh step_start upload "Uploading artifact"

      - name: Upload APK to storage
        if: ${{ env.apk_path != '' }}
        id: storage
        working-directory: workspace/android
        run: |
          set -e
          UPLOAD_URL="${{ inputs.callback_url }}"
          UPLOAD_URL="${UPLOAD_URL%/build-webhook}/build-upload-apk?build_id=${{ inputs.build_id }}&kind=apk&filename=$(basename "$apk_path")"
          RESP=$(curl -fsS -X POST "$UPLOAD_URL" \
            -H "x-build-secret: ${{ inputs.webhook_secret }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@$apk_path")
          echo "$RESP"
          STORAGE_URL=$(node -e "console.log(JSON.parse(process.argv[1]).url||'')" "$RESP")
          APK_SIZE=$(stat -c%s "$apk_path")
          echo "download_url=$STORAGE_URL" >> $GITHUB_OUTPUT
          echo "apk_size=$APK_SIZE"        >> $GITHUB_OUTPUT

      - name: Upload AAB to storage
        if: ${{ env.aab_path != '' }}
        id: aab_storage
        working-directory: workspace/android
        run: |
          set -e
          UPLOAD_URL="${{ inputs.callback_url }}"
          UPLOAD_URL="${UPLOAD_URL%/build-webhook}/build-upload-apk?build_id=${{ inputs.build_id }}&kind=aab&filename=$(basename "$aab_path")"
          RESP=$(curl -fsS -X POST "$UPLOAD_URL" \
            -H "x-build-secret: ${{ inputs.webhook_secret }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$aab_path")
          echo "$RESP"
          AAB_URL=$(node -e "console.log(JSON.parse(process.argv[1]).url||'')" "$RESP")
          AAB_SIZE=$(stat -c%s "$aab_path")
          echo "download_url=$AAB_URL" >> $GITHUB_OUTPUT
          echo "aab_size=$AAB_SIZE"    >> $GITHUB_OUTPUT

      - name: Upload APK artifact (backup)
        if: ${{ env.apk_path != '' }}
        uses: actions/upload-artifact@v4
        with: { name: app-apk, path: "${{ env.apk_path }}", retention-days: 30 }

      - name: Upload AAB artifact (backup)
        if: ${{ env.aab_path != '' }}
        uses: actions/upload-artifact@v4
        with: { name: app-release-aab, path: "${{ env.aab_path }}", retention-days: 30 }

      - name: Notify — uploaded
        run: /tmp/build_notify.sh step_done upload "Artifact uploaded"

      - name: Notify — ready
        if: success()
        run: |
          DL_URL="${{ steps.storage.outputs.download_url }}"
          DL_SIZE="${{ steps.storage.outputs.apk_size }}"
          AAB_URL="${{ steps.aab_storage.outputs.download_url }}"
          # If AAB is the only artifact (aab-release), surface it as the primary download.
          if [ -z "$DL_URL" ] && [ -n "$AAB_URL" ]; then
            DL_URL="$AAB_URL"
            DL_SIZE="${{ steps.aab_storage.outputs.aab_size }}"
          fi
          DL_SIZE_NUM=${DL_SIZE:-0}
          curl -sS -X POST "${{ inputs.callback_url }}" \
            -H "x-build-secret: ${{ inputs.webhook_secret }}" -H "Content-Type: application/json" \
            -d "{\"build_id\":\"${{ inputs.build_id }}\",\"event\":\"build_done\",\"download_url\":\"$DL_URL\",\"file_size_bytes\":$DL_SIZE_NUM,\"aab_download_url\":\"$AAB_URL\",\"keystore_sha1\":\"${{ steps.keystore.outputs.sha1 }}\"}"

      - name: Notify — failed
        if: failure()
        run: |
          curl -sS -X POST "${{ inputs.callback_url }}" \
            -H "x-build-secret: ${{ inputs.webhook_secret }}" -H "Content-Type: application/json" \
            -d '{"build_id":"${{ inputs.build_id }}","event":"build_failed","error_message":"Build failed — see Actions log"}'
